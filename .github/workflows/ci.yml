name: ssm-fleet-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.9.8
  PYTHON_VERSION: '3.12'

jobs:
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      # No backend is configured: this validates the configuration, it does not
      # touch state and never contacts an account.
      - name: Initialise without a backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Lint
        uses: terraform-linters/setup-tflint@19a52fbac37dacb22a09518e4ef6ee234f2d4987 # v4.0.0
        with:
          tflint_version: v0.53.0

      - name: Run tflint
        run: |
          tflint --init
          tflint --minimum-failure-severity=error

  document-lint:
    name: Document schema lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install flake8==7.1.1 yamllint==1.35.1

      # Documents are published verbatim, so a YAML defect ships as-is.
      - name: Lint document YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable, truthy: disable, comments-indentation: disable}}" \
            documents/ automation/ .github/workflows/

      - name: Lint Python
        run: |
          flake8 --select=E9,F63,F7,F82 --show-source .
          git ls-files '*.py' | xargs -r -n1 python -m py_compile

      # Schema, control flow, cross-document contracts, and rendered script syntax.
      - name: Validate documents and runbooks
        run: python -m pytest tests -q

  ci-complete:
    name: CI complete
    runs-on: ubuntu-24.04
    needs: [terraform-validate, document-lint]
    steps:
      - name: Report success
        run: echo "Terraform validation and document schema lint both passed."
